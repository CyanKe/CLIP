# ============================================================================
# 1D Model for CZSL Radar Jamming Signal Classification
# Supports: Conformer / ResNet1D / CNN1D (select via model.backbone)
# ============================================================================

# 通用模型配置
model:
  backbone: "conformer"              # "conformer" | "resnet1d" | "cnn1d"
  clip_model: "ViT-B/32"            # 仅用于文本编码器 (不加载 ViT)
  freeze_text: true
  embed_dim: 512

  # Conformer 架构参数 (仅在 backbone=conformer 时生效)
  conformer:
    in_channels: 2                  # I/Q 双通道
    hidden_dim: 256
    num_blocks: 6
    num_heads: 4
    ffn_expansion: 4
    conv_kernel_size: 15
    dropout: 0.1

  # ResNet1D / CNN1D 无需额外参数，使用标准架构

# 训练配置
train:
  batch_size: 16                    # 较小 batch，Conformer 从头训练
  epochs: 30
  lr: 0.0001                        # 1e-4 (比 ViT 微调高，因为从头训练)
  weight_decay: 0.01
  warmup_epochs: 3
  threshold: 0.07                   # 多标签预测阈值

  scheduler:
    type: "cosine"
    min_lr: 0.000001                # 1e-6

  use_amp: false                    # 混合精度（建议关闭）
  grad_clip: 1.0

# 损失函数配置
loss:
  type: "multilabel_infonce"        # label_aware_infonce | infonce | multilabel_infonce | asymmetric | bce
  temperature: 0.07                 # CLIP 默认温度
  label_smoothing: 0.0
  learnable_temperature: true
  handle_zero_sum: "self_only"
  similarity_metric: "iou"

# 数据配置
data:
  base_path: "D:\\VScode\\Jamming_signal_simulation\\output\\8x9"
  jnr_start: 5
  jnr_end: 5
  jnr_step: 5                      # JNR_+0, JNR_+1, ..., JNR_+20
  num_workers: 0
  pin_memory: true
  time_seq_len: 8000
  time_var_name: "all_times"

# 特征条件上下文 (CoOp-style, 可选)
use_feature_context: false          # 总开关
n_ctx_per_domain:
  time: 2
  freq: 2
  bispectrum: 1
  wavelet: 3
  statistical: 2
feature_norm_stats_path: "multi/feature_normalization_stats.json"
prompt_lr: 0.002

# 日志配置
logging:
  type: "console"                   # wandb | console | tensorboard
  name: "Conformer_CZSL_1D"

  wandb:
    project: "CLIP-CZSL-Jamming"
    entity: "cyanke9142-xidian-university"
    tags: ["1D", "CZSL", "Time-Domain"]
    notes: "1D Conformer on raw I/Q time-domain signals for CZSL radar jamming classification"

  tensorboard:
    log_dir: "runs/conformer_1d"

# 评估配置（evaluate_conformer.py：CLI 未指定时读取此处；CLI 优先于 config）
evaluation:
  checkpoint: "checkpoints/1d/conformer_best_model.pt"  # 模型权重；CLI --checkpoint 可覆盖
  mode: "by_combination"           # zero_shot | by_combination | by_jnr
  split: "test"                    # train | val | test
  output_dir: "results/conformer_1d"
  backbone: null                   # null=用 model.backbone；或 conformer | resnet1d | cnn1d
  threshold: 0.5                   # by_combination 多标签阈值（预留）
  save_predictions: true
  visualize_embeddings: true
  debug: false                     # 打印首 batch 调试信息
  # 可视化开关（脚本若支持则读取；与 multi/persistence 字段对齐）
  visualize: false
  tsne: false
  umap: false
  roc: false
  pr: false

# 保存配置
checkpoint:
  save_dir: "checkpoints\\1d"            # 自动加 backbone 前缀 (e.g. checkpoints/conformer_best_model.pt)
  save_best_only: true
  save_interval: 10                      # 每 N 个 epoch 保存一次 latest 检查点
  monitor: "val_loss"
  mode: "min"

# 干扰类型定义
jamming_classes:
  - name: "DFTJ"
  - name: "SMSPJ"
  - name: "CSJ"
  - name: "ISCJ"
  - name: "ISRJ"
  - name: "MISRJ"
  - name: "ISDJ"
  - name: "C&IJ"
  
  - name: "AJ"
  - name: "BJ"
  - name: "SJ"
  - name: "NAMJ"
  - name: "NPMJ"
  - name: "NFMJ"
  - name: "PJ"
  - name: "NCJ"
  - name: "NPJ"  

# 是否在 CLIP 文本-信号相似度计算中使用全称翻译（true=全称，false=简称）。
# 仅影响喂给文本编码器的文本，类别统计/可视化始终用简称。消融对比在此切换。
use_translation: false

# 类别名称翻译
label_translations:
  DFTJ: "DFTJ, Dense False Target Jamming"            # 密集假目标干扰
  ISRJ: "ISRJ, Interrupted Sampling Repeater Jamming" # 中断采样转发干扰
  MISRJ: "MISRJ, Modulated-Interrupted Sampling Repeater Jamming" # 调制-中断采样转发干扰
  ISDJ: "ISDJ, Interrupted Sampling Direct Jamming"   # 中断采样直接干扰
  ISCJ: "ISCJ, Interrupted Sampling Circular Jamming" # 中断采样循环干扰
  AJ: "AJ, Aim-point Jamming"                         # 瞄准式干扰
  BJ: "BJ, Barrage Jamming"                           # 阻塞式干扰
  SJ: "SJ, Sweep Jamming"                             # 扫频干扰
  NCJ: "NCJ, Noise Convolution Jamming"               # 噪声调频干扰
  NPJ: "NPJ, Noise Product Jamming"                   # 噪声调相干扰
  SMSPJ: "SMSPJ, Smeared Spectrum Jamming"            # 弥散谱干扰
  "C&IJ": "C&IJ, Chopping and Interleaved Jamming"    # 交错干扰
  NFMJ: "NFMJ, Noise Frequency Modulation Jamming"    # 噪声调频干扰
  NPMJ: "NPMJ, Noise Phase Modulation Jamming"        # 噪声调相干扰
  NAMJ: "NAMJ, Noise Amplitude Modulation Jamming"    # 噪声调幅干扰
  CSJ: "CSJ, Comb Spectrum Jamming"                   # 梳状谱干扰
  PJ: "PJ, Pulse Jamming"                             # 相位干扰

