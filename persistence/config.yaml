# ============================================================================
# Persistence Spectrum (持续时间谱) CLIP 训练配置
# ============================================================================

# CLIP 模型配置
model:
  clip_model: "ViT-B/32"

  freeze_vision: false         # 设为 false 以启用部分解冻
  vision_layers_unfreeze: 2    # 只解冻视觉编码器最后2层
  freeze_text: false            # 冻结文本编码器

# 训练配置
train:
  batch_size: 64
  epochs: 20
  lr: 0.0001                     # 1e-5
  weight_decay: 0.01
  warmup_epochs: 2
  threshold: 0.14                  # 多标签预测阈值

  scheduler:
    type: "cosine"
    min_lr: 0.0000001             # 1e-7

  use_amp: false
  grad_clip: 1.0

# 损失函数配置
loss:
  type: "multilabel_infonce"   # label_aware_infonce | infonce | multilabel_infonce | asymmetric | bce
  temperature: 0.1             # 对比损失温度参数
  label_smoothing: 0.0
  learnable_temperature: true
  handle_zero_sum: "self_only"
  similarity_metric: "iou"

# ============================================================================
# 消融实验配置 — 控制数据加载模式
# ============================================================================
ablation:
  mode: "persistence"           # "persistence" | "stft" | "fusion"
                                # persistence = only echo_persistences.mat (baseline)
                                # stft        = only echo_stfts.mat (3× magnitude)
                                # fusion      = both files → [persistence, stft_mag, stft_phase]

# 数据配置
data:
  base_path: "E:\\912_cyan\\Jamming_signal_simulation\\output\\2D_8X9"
  jnr_start: 0
  jnr_end: 20
  jnr_step: 1
  num_workers: 0
  pin_memory: true
  image_size: 224
  persistence_var_name: "all_persistences"
  persistence_suffix: "echo_persistences"
  # STFT 数据配置 (仅 stft / fusion 模式使用)
  stft_suffix: "echo_stfts"
  stft_var_name: "all_stfts"
  # STFT 归一化 (仅 stft / fusion 模式使用)
  normalize_mode: "per_sample"    # per_sample | global
  normalize_method: "p99"         # p99 | p95 | max

# 特征条件上下文 (CoOp-style, 可选)
use_feature_context: false

n_ctx_per_domain:
  time: 2
  freq: 2
  bispectrum: 1
  wavelet: 3
  statistical: 2

feature_norm_stats_path: "multi/feature_normalization_stats.json"
prompt_lr: 0.002

# 日志配置
logging:
  type: "wandb"                # wandb | console | tensorboard
  name: "CLIP_Persistence_CZSL"

  wandb:
    project: "CLIP-CZSL-Jamming"
    entity: "cyanke9142-xidian-university"
    tags: ["CLIP", "CZSL", "Persistence", "Jamming"]
    notes: "CLIP fine-tuning on persistence spectrum for CZSL radar jamming classification"

  tensorboard:
    log_dir: "runs/persistence"

# 评估配置
evaluation:
  checkpoint: "checkpoints\\persistence_step\\persistence_best.pt"
  mode: "all"                      # all | zero_shot | by_combination | by_jnr
  split: "train"                    # train | val | test
  # threshold: 0.5
  zero_shot_threshold: 0.5        # zero_shot 专用（组合空间匹配）
  by_combination_threshold: 0.5  # by_combination 专用（单类 softmax）
  output_dir: "results/persistence8x9"
  visualize: false                  # 生成所有可视化
  tsne: false                      # 仅 t-SNE
  umap: false                      # 仅 UMAP
  roc: true                       # 仅 ROC 曲线
  pr: true                        # 仅 PR 曲线

# 保存配置
checkpoint:
  save_dir: "checkpoints/persistence"
  save_best_only: true
  monitor: "val_loss"
  mode: "min"

# 干扰类型定义 (与 STFT 相同)
jamming_classes:
  - name: "DFTJ"
  - name: "SMSPJ"
  - name: "CSJ"
  - name: "ISCJ"
  - name: "ISRJ"
  - name: "MISRJ"
  - name: "ISDJ"
  - name: "C&IJ"
  
  - name: "AJ"
  - name: "BJ"
  - name: "SJ"
  - name: "NAMJ"
  - name: "NPMJ"
  - name: "NFMJ"
  - name: "PJ"
  - name: "NCJ"
  - name: "NPJ"  

# 类别名称翻译字典
label_translations:
  DFTJ: "Dense False Target Jamming"
  ISRJ: "Interrupted Sampling Repeater Jamming"
  AJ: "Aim-point Jamming"
  BJ: "Barrage Jamming"
  SJ: "Sweep Jamming"
  NCJ: "Noise FM Jamming"
  NPJ: "Noise PM Jamming"
  SMSPJ: "Smoothed Pseudo Wigner-Ville Jamming"
  "C&IJ": "Chopping and Interleaved Jamming"
  NFMJ: "Noise Frequency Modulation Jamming"
  NPMJ: "Noise Phase Modulation Jamming"
  NAMJ: "Noise Amplitude Modulation Jamming"
  CSJ: "Comb Spectrum Jamming"
  PJ: "Phase Jamming"

# CZSL 配置 - Seen/Unseen 组合划分
czsl:
