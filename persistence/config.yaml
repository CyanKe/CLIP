# ============================================================================
# Persistence Spectrum (持续时间谱) CLIP 训练配置
# ============================================================================

# CLIP 模型配置
model:
  clip_model: "ViT-B/32"

  freeze_vision: false         # 设为 false 以启用部分解冻
  vision_layers_unfreeze: 2    # 只解冻视觉编码器最后2层
  freeze_text: true            # 冻结文本编码器

# 训练配置
train:
  batch_size: 32
  epochs: 20
  lr: 0.0001                     # 1e-5
  weight_decay: 0.01
  warmup_epochs: 2
  threshold: 0.14                  # 多标签预测阈值

  scheduler:
    type: "cosine"
    min_lr: 0.0000001             # 1e-7

  use_amp: false
  grad_clip: 1.0

# 损失函数配置
loss:
  type: "multilabel_infonce"   # label_aware_infonce | infonce | multilabel_infonce | asymmetric | bce
  temperature: 0.1             # 对比损失温度参数
  label_smoothing: 0.0
  learnable_temperature: true
  handle_zero_sum: "self_only"
  similarity_metric: "iou"

# ============================================================================
# 消融实验配置 — 控制数据加载模式
# ============================================================================
ablation:
  mode: "stft"           # "persistence" | "stft" | "fusion"
                                # persistence = only echo_persistences.mat (baseline)
                                # stft        = only echo_stfts.mat (3× magnitude)
                                # fusion      = both files → [persistence, stft_mag, stft_phase]

# 数据配置
data:
  base_path: "E:\\912_cyan\\Jamming_signal_simulation\\output\\2D_8X7"
  jnr_start: 0
  jnr_end: 20
  jnr_step: 1
  num_workers: 0
  pin_memory: true
  image_size: 224
  persistence_var_name: "all_persistences"
  persistence_suffix: "echo_persistences"
  # STFT 数据配置 (仅 stft / fusion 模式使用)
  stft_suffix: "echo_stfts"
  stft_var_name: "all_stfts"
  # STFT 归一化 (仅 stft / fusion 模式使用)
  normalize_mode: "per_sample"    # per_sample | global
  normalize_method: "p99"         # p99 | p95 | max

# 特征条件上下文 (CoOp-style, 可选)
use_feature_context: false

n_ctx_per_domain:
  time: 2
  freq: 2
  bispectrum: 1
  wavelet: 3
  statistical: 2

feature_norm_stats_path: "multi/feature_normalization_stats.json"
prompt_lr: 0.002

# 日志配置
logging:
  type: "wandb"                # wandb | console | tensorboard
  name: "CLIP_Persistence_CZSL"

  wandb:
    project: "CLIP-CZSL-Jamming"
    entity: "cyanke9142-xidian-university"
    tags: ["CLIP", "CZSL", "Persistence", "Jamming"]
    notes: "CLIP fine-tuning on persistence spectrum for CZSL radar jamming classification"

  tensorboard:
    log_dir: "runs/persistence"

# 评估配置
evaluation:
  threshold: 0.5
  save_predictions: true
  visualize_embeddings: true

# 保存配置
checkpoint:
  save_dir: "checkpoints/persistence"
  save_best_only: true
  monitor: "val_loss"
  mode: "min"

# 干扰类型定义 (与 STFT 相同)
jamming_classes:
  - name: "DFTJ"
  - name: "ISRJ"
  - name: "ISDJ"
  - name: "ISCJ"
  - name: "MISRJ"
  - name: "AJ"
  - name: "BJ"
  - name: "SJ"
  - name: "NCJ"
  - name: "NPJ"
  - name: "SMSPJ"
  - name: "C&IJ"
  - name: "NFMJ"
  - name: "NPMJ"
  - name: "NAMJ"
  - name: "CSJ"
  - name: "PJ"

# 类别名称翻译字典
label_translations:
  DFTJ: "DFTJ, Dense False Target Jamming"            # 密集假目标干扰
  ISRJ: "ISRJ, Interrupted Sampling Repeater Jamming" # 中断采样转发干扰
  MISRJ: "MISRJ, Modulated-Interrupted Sampling Repeater Jamming" # 调制-中断采样转发干扰
  ISDJ: "ISDJ, Interrupted Sampling Direct Jamming"   # 中断采样直接干扰
  ISCJ: "ISCJ, Interrupted Sampling Circular Jamming" # 中断采样循环干扰
  AJ: "AJ, Aim-point Jamming"                         # 瞄准式干扰
  BJ: "BJ, Barrage Jamming"                           # 阻塞式干扰
  SJ: "SJ, Sweep Jamming"                             # 扫频干扰
  NCJ: "NCJ, Noise Convolution Jamming"               # 噪声调频干扰
  NPJ: "NPJ, Noise Product Jamming"                   # 噪声调相干扰
  SMSPJ: "SMSPJ, Smeared Spectrum Jamming"            # 弥散谱干扰
  "C&IJ": "C&IJ, Chopping and Interleaved Jamming"    # 交错干扰
  NFMJ: "NFMJ, Noise Frequency Modulation Jamming"    # 噪声调频干扰
  NPMJ: "NPMJ, Noise Phase Modulation Jamming"        # 噪声调相干扰
  NAMJ: "NAMJ, Noise Amplitude Modulation Jamming"    # 噪声调幅干扰
  CSJ: "CSJ, Comb Spectrum Jamming"                   # 梳状谱干扰
  PJ: "PJ, Pulse Jamming"                             # 相位干扰

# CZSL 配置 - Seen/Unseen 组合划分
czsl:
  seen_combinations:
    seen_combinations:
    # 单干扰类型（全部为seen）
    # 欺骗干扰
    - ["DFTJ"]
    - ["SMSPJ"]
    - ["CSJ"]
    - ["ISCJ"]
    - ["ISDJ"]
    - ["ISRJ"]
    - ["MISRJ"]
    - ["C&IJ"]

    # 压制干扰
    - ["AJ"]
    - ["BJ"]
    - ["SJ"]
    - ["NAMJ"]
    - ["NPMJ"]
    - ["NFMJ"]
    - ["PJ"]
    - ["NCJ"]
    - ["NPJ"]


  unseen_combinations:
  # 未见组合（用于零样本测试）
  # 这些组合在训练时不出现，但测试时需要识别

    - ["DFTJ", "AJ"]
    - ["DFTJ", "BJ"]
    - ["DFTJ", "SJ"]
    - ["DFTJ", "NAMJ"]
    - ["DFTJ", "NPMJ"]
    - ["DFTJ", "NFMJ"]
    - ["DFTJ", "PJ"]

    - ["SMSPJ", "AJ"]
    - ["SMSPJ", "BJ"]
    - ["SMSPJ", "SJ"]
    - ["SMSPJ", "NAMJ"]
    - ["SMSPJ", "NPMJ"]
    - ["SMSPJ", "NFMJ"]
    - ["SMSPJ", "PJ"]

    - ["CSJ", "AJ"]
    - ["CSJ", "BJ"]
    - ["CSJ", "SJ"]
    - ["CSJ", "NAMJ"]
    - ["CSJ", "NPMJ"]
    - ["CSJ", "NFMJ"]
    - ["CSJ", "PJ"]

    - ["ISCJ", "AJ"]
    - ["ISCJ", "BJ"]
    - ["ISCJ", "SJ"]
    - ["ISCJ", "NAMJ"]
    - ["ISCJ", "NPMJ"]
    - ["ISCJ", "NFMJ"]
    - ["ISCJ", "PJ"]

    - ["ISDJ", "AJ"]
    - ["ISDJ", "BJ"]
    - ["ISDJ", "SJ"]
    - ["ISDJ", "NAMJ"]
    - ["ISDJ", "NPMJ"]
    - ["ISDJ", "NFMJ"]
    - ["ISDJ", "PJ"]

    - ["ISRJ", "AJ"]
    - ["ISRJ", "BJ"]
    - ["ISRJ", "SJ"]
    - ["ISRJ", "NAMJ"]
    - ["ISRJ", "NPMJ"]
    - ["ISRJ", "NFMJ"]
    - ["ISRJ", "PJ"]

    - ["MISRJ", "AJ"]
    - ["MISRJ", "BJ"]
    - ["MISRJ", "SJ"]
    - ["MISRJ", "NAMJ"]
    - ["MISRJ", "NPMJ"]
    - ["MISRJ", "NFMJ"]
    - ["MISRJ", "PJ"]

    - ["C&IJ", "AJ"]
    - ["C&IJ", "BJ"]
    - ["C&IJ", "SJ"]
    - ["C&IJ", "NAMJ"]
    - ["C&IJ", "NPMJ"]
    - ["C&IJ", "NFMJ"]
    - ["C&IJ", "PJ"]
  unseen_ratio: 0
  split_seed: 42

  zero_shot:
    use_combinations: true
    max_combination_size: 2
    threshold: 0.14
