# ============================================================================
# 组合零样本学习配置文件
# ============================================================================

# CLIP 模型配置
model:
  # CLIP 模型选项 (OpenAI):
  # - "ViT-B/32", "ViT-B/16", "ViT-L/14", "RN50", "RN101", "resnet18"
  clip_model: "RN50"

  patch_pooling: "cls"    # 视觉特征池化方式: "cls" (默认, 仅用[CLS] token) | "mean" (patch 均值池化)
  freeze_vision: false         # 设为 false 以启用部分解冻
  vision_layers_unfreeze: 2    # 只解冻最后N层, 0=完全解冻所有层
  freeze_text: false            # 冻结文本编码器
  backbone: "vit"     # "vit" | "multishape_vit" | "resnet18"
  dual_branch: false             # 是否开启双分支
  patch_sizes: [[32,32]] # [8, 32], [8, 32], [16, 16]
  embed_dim: 512
  depth: 6
  num_heads: 8
  fusion_mode: "early_fusion"

# 保存配置
checkpoint:
  save_dir: "checkpoints"
  save_best_only: false  # 保存所有epoch的检查点，便于调试
  monitor: "val_f1"             # 监控指标
  mode: "max"                    # max or min
  model_name: "RN50_both_8x9"

# 训练配置
train:
  batch_size: 32
  epochs: 20
  lr: 0.00001                     # 1e-5
  weight_decay: 0.01
  warmup_epochs: 2
  threshold: 0.07                  # 多标签预测阈值

  # 学习率调度
  scheduler:
    type: "cosine"                # cosine, linear, constant
    min_lr: 0.0000001             # 1e-7

  # 混合精度训练（CLIP内部已使用FP16，建议关闭）
  use_amp: false

  # 梯度裁剪
  grad_clip: 1.0

# 损失函数配置
loss:
  type: "multilabel_infonce"   # label_aware_infonce, infonce, multilabel_infonce, asymmetric, bce
  temperature: 0.1             # 对比损失温度参数 (SigLIP 默认 0.1, CLIP 默认 0.07)
  label_smoothing: 0.0          # 标签平滑
  learnable_temperature: true   # 是否学习温度参数
  handle_zero_sum: "self_only"  # 处理无同类样本的策略: self_only, uniform, skip

  # SigLIP Sigmoid Loss 专用参数
  initial_bias: -10.0          # 初始 logit bias
  similarity_metric: "iou"     # 多标签相似度度量: iou 或 binary

# 数据配置
data:
  base_path: "E:\\912_cyan\\Jamming_signal_simulation\\output\\2D_8X9"
  jnr_start: 0
  jnr_end: 20
  jnr_step: 5
  num_workers: 0
  pin_memory: true

  # 图像预处理
  image_size: 224                # CLIP输入分辨率

  # 时域数据配置
  time_seq_len: 8000             # 时域信号序列长度
  time_var_name: "all_times"     # 时域数据在HDF5中的变量名
  stft_suffix: "echo_stfts"     # STFT 文件名后缀 (改为 echo_dechirp_stfts 切换数据)

# 模型开关配置
use_time_domain: false          # 是否使用时域信号进行消融实验

# ============================================================================
# Feature-Conditioned Context (CoOp-style) 配置
# 用域感知 Meta-Net 将22维信号特征映射为可学习上下文向量，
# 注入冻结文本 Transformer，使文本表征随输入信号物理特性动态调整
# ============================================================================
use_feature_context: false          # 总开关 (true 启用 CoOp-style 特征条件上下文)

n_ctx_per_domain:                   # 各域生成的上下文 token 数 (总=10)
  time: 2                           # 时域 5维 → 2 tokens
  freq: 2                           # 频域 4维 → 2 tokens
  bispectrum: 1                     # 双谱 2维 → 1 token
  wavelet: 3                        # 小波 8维 → 3 tokens
  statistical: 2                    # 统计 3维 → 2 tokens

feature_norm_stats_path: "multi/feature_normalization_stats.json"  # 特征归一化统计量
prompt_lr: 0.002                    # Meta-Net 学习率 (比 base lr 高 ~200x)

# LoRA 微调配置（禁用，改用解冻最后N层策略）
lora:
  enabled: false                # 是否启用 LoRA
  target_modules:               # 目标模块（Attention 层）
    - "attn"
  rank: 8                       # LoRA 秩
  alpha: 16.0                   # LoRA 缩放因子
  dropout: 0.0                  # LoRA Dropout

# ============================================================================
# 日志配置
# ============================================================================
logging:
  type: "console"                # wandb, console, tensorboard
  name: "CLIP_CZSL_Jamming"

  # WandB配置
  wandb:
    project: "CLIP-CZSL-Jamming"
    entity: "cyanke9142-xidian-university"
    tags: ["CLIP", "CZSL", "Multi-label", "Jamming"]
    notes: "CLIP fine-tuning for Compositional Zero-Shot Learning on Radar Jamming Signals"

  # TensorBoard配置
  tensorboard:
    log_dir: "runs/clip_czsl"

# 评估配置（evaluate_czsl.py：CLI 未指定时读取此处；CLI 优先于 config）
evaluation:
  checkpoint: "checkpoints/RN50_both_8x9_best.pt"   # 模型权重；CLI --checkpoint 可覆盖
  mode: "all"                      # all | by_jnr
  split: "test"                    # train | val | test
  output_dir: "results/multi"
  threshold: 0.5                   # 多标签阈值（预留）
  save_predictions: true
  visualize_embeddings: true
  # 可视化开关（对应 CLI --visualize / --tsne / --umap / --roc / --pr）
  visualize: false                 # 全部可视化
  tsne: false
  umap: false
  roc: false
  pr: false
  save_stft: false                 # 保存 STFT 预测图
  # max_stft_samples: null         # 限制 STFT 保存数量；null=全部

# 干扰类型定义
jamming_classes:
  - name: "DFTJ"
  - name: "ISRJ"
  - name: "ISDJ"
  - name: "ISCJ"
  - name: "MISRJ"
  - name: "AJ"
  - name: "BJ"
  - name: "SJ"
  - name: "NCJ"
  - name: "NPJ"
  - name: "SMSPJ"
  - name: "C&IJ"
  - name: "NFMJ"
  - name: "NPMJ"
  - name: "NAMJ"
  - name: "CSJ"
  - name: "PJ"

# ============================================================================
# 干扰类型分组配置 - 用于双分支分类
# ============================================================================
jamming_groups:
  deception:
    name: "欺骗干扰"
    classes: ["DFTJ", "ISRJ", "MISRJ", "ISCJ", "ISDJ", "SMSPJ", "C&IJ", "CSJ"]
    none_class: "无欺骗干扰"
  suppression:
    name: "压制干扰"
    classes: ["AJ", "BJ", "SJ", "NCJ", "NPJ", "NFMJ", "NPMJ", "NAMJ", "PJ"]
    none_class: "无压制干扰"

# ============================================================================
# 类别名称翻译字典 (缩写 -> 全称)
# 用于生成更具语义的文本描述，提升 CLIP 的理解能力
# ============================================================================
label_translations:
  DFTJ: "Dense False Target Jamming"           # 密集假目标干扰
  ISRJ: "Interrupted Sampling Repeater Jamming" # 间歇采样转发干扰
  AJ: "Aim-point Jamming"                       # 瞄准式干扰
  BJ: "Barrage Jamming"                         # 阻塞式干扰
  SJ: "Sweep Jamming"                           # 扫频干扰
  NCJ: "Noise FM Jamming"                       # 噪声调频干扰
  NPJ: "Noise PM Jamming"                       # 噪声调相干扰
  SMSPJ: "Smoothed Pseudo Wigner-Ville Jamming" # 平滑伪Wigner-Ville干扰
  "C&IJ": "Chopping and Interleaved Jamming"    # 切割交错干扰
  NFMJ: "Noise Frequency Modulation Jamming"    # 噪声调频干扰
  NPMJ: "Noise Phase Modulation Jamming"        # 噪声调相干扰
  NAMJ: "Noise Amplitude Modulation Jamming"    # 噪声调幅干扰
  CSJ: "Comb Spectrum Jamming"                  # 梳状谱干扰
  PJ: "Phase Jamming"                           # 相位干扰

