# ============================================================================
# 组合零样本学习配置文件
# ============================================================================

# CLIP模型配置
model:
  clip_model: "ViT-B/32"       # CLIP模型类型: RN50, RN101, ViT-B/32, ViT-B/16, ViT-L/14, resnet18
  freeze_vision: false           # 冻结视觉编码器（避免FP16梯度问题）
  freeze_text: false             # 是否冻结文本编码器
  # vision_layers_unfreeze: 2     # 不解冻视觉编码器

# 训练配置
train:
  batch_size: 8
  epochs: 5
  lr: 0.00001                     # 1e-5
  weight_decay: 0.01
  warmup_epochs: 2
  threshold: 0.5                  # 多标签预测阈值

  # 学习率调度
  scheduler:
    type: "cosine"                # cosine, linear, constant
    min_lr: 0.0000001             # 1e-7

  # 混合精度训练（CLIP内部已使用FP16，建议关闭）
  use_amp: false

  # 梯度裁剪
  grad_clip: 1.0

# 损失函数配置
loss:
  type: "infonce"     # czsl_contrastive, infonce, multilabel_infonce, asymmetric, bce
  temperature: 0.07            # 对比损失温度参数
  label_smoothing: 0.0         # 标签平滑
  contrastive_weight: 1.0      # 对比损失权重
  classification_weight: 0.0   # 分类损失权重（0表示纯对比学习）
  learnable_temperature: true  # 是否学习温度参数

# 数据配置
data:
  base_path: "D:/VScode/Jamming_signal_simulation/output/260415"
  jnr_start: 0
  jnr_end: 20
  jnr_step: 5
  num_workers: 4
  pin_memory: true

  # 图像预处理
  image_size: 224                # CLIP输入分辨率

  # 时域数据配置
  time_seq_len: 8000             # 时域信号序列长度
  time_var_name: "all_times"     # 时域数据在HDF5中的变量名

# 模型开关配置
use_time_domain: false          # 是否使用时域信号进行消融实验

# ============================================================================
# 日志配置
# ============================================================================
logging:
  type: "console"                # wandb, console, tensorboard
  name: "CLIP_CZSL_Jamming"

  # WandB配置
  wandb:
    project: "CLIP-CZSL-Jamming"
    entity: "cyanke9142-xidian-university"
    tags: ["CLIP", "CZSL", "Multi-label", "Jamming"]
    notes: "CLIP fine-tuning for Compositional Zero-Shot Learning on Radar Jamming Signals"

  # TensorBoard配置
  tensorboard:
    log_dir: "runs/clip_czsl"

# 评估配置
evaluation:
  threshold: 0.5
  save_predictions: true
  visualize_embeddings: true

# 保存配置
checkpoint:
  save_dir: "checkpoints"
  save_best_only: false  # 保存所有epoch的检查点，便于调试
  monitor: "val_f1"             # 监控指标
  mode: "max"                    # max or min

# 干扰类型定义
jamming_classes:
  - name: "DFTJ"
  - name: "ISRJ"
  - name: "AJ"
  - name: "BJ"
  - name: "SJ"
  - name: "NCJ"
  - name: "NPJ"
  - name: "SMSPJ"
  - name: "C&IJ"
  - name: "NFMJ"
  - name: "NPMJ"
  - name: "NAMJ"
  - name: "CSJ"
  - name: "PJ"

# ============================================================================
# CZSL 配置 - 组合零样本学习
# czsl.seen_combinations: 训练时可见的组合
# czsl.unseen_combinations: 仅测试时评估的零样本组合
# loss.type: "czsl_contrastive": 使用对比损失
# ============================================================================
czsl:
  # Seen/Unseen 组合划分
  # 格式: [类别名] 或 [类别名1, 类别名2] 表示组合

  # 已见组合（用于训练）
  # 默认：所有单干扰类型都是seen
  # 可以添加部分两两组合作为seen
  seen_combinations:
    # 单干扰类型（全部为seen）
    # 欺骗干扰
    - ["DFTJ"]
    - ["ISRJ"]
    - ["SMSPJ"]
    - ["C&IJ"]
    - ["CSJ"]
    # 压制干扰
    - ["AJ"]
    - ["BJ"]
    - ["SJ"]
    - ["NCJ"]
    - ["NPJ"]
    - ["NFMJ"]
    - ["NPMJ"]
    - ["NAMJ"]
    - ["PJ"]


  # 合作为seen（训练时可见）

  unseen_combinations:
  # 未见组合（用于零样本测试）
  # 这些组合在训练时不出现，但测试时需要识别

    # - ["DFTJ", "AJ"]
    # - ["DFTJ", "BJ"]
    # - ["DFTJ", "SJ"]
    # - ["DFTJ", "NCJ"]
    # - ["DFTJ", "NPJ"]
    # - ["DFTJ", "NAMJ"]
    # - ["DFTJ", "NPMJ"]
    # - ["DFTJ", "NFMJ"]
    # - ["DFTJ", "PJ"]

    # - ["ISRJ", "AJ"]
    # - ["ISRJ", "BJ"]
    # - ["ISRJ", "SJ"]
    # - ["ISRJ", "NCJ"]
    # - ["ISRJ", "NPJ"]
    # - ["ISRJ", "NAMJ"]
    # - ["ISRJ", "NPMJ"]
    # - ["ISRJ", "NFMJ"]
    # - ["ISRJ", "PJ"]

    # - ["SMSPJ", "AJ"]
    # - ["SMSPJ", "BJ"]
    # - ["SMSPJ", "SJ"]
    # - ["SMSPJ", "NCJ"]
    # - ["SMSPJ", "NPJ"]
    # - ["SMSPJ", "NAMJ"]
    # - ["SMSPJ", "NPMJ"]
    # - ["SMSPJ", "NFMJ"]
    # - ["SMSPJ", "PJ"]

    # - ["C&IJ", "AJ"]
    # - ["C&IJ", "BJ"]
    # - ["C&IJ", "SJ"]
    # - ["C&IJ", "NCJ"]
    # - ["C&IJ", "NPJ"]
    # - ["C&IJ", "NAMJ"]
    # - ["C&IJ", "NPMJ"]
    # - ["C&IJ", "NFMJ"]
    # - ["C&IJ", "PJ"]

    # - ["CSJ", "AJ"]
    # - ["CSJ", "BJ"]
    # - ["CSJ", "SJ"]
    # - ["CSJ", "NCJ"]
    # - ["CSJ", "NPJ"]
    # - ["CSJ", "NAMJ"]
    # - ["CSJ", "NPMJ"]
    # - ["CSJ", "NFMJ"]
    # - ["CSJ", "PJ"]


  # 数据划分参数
  unseen_ratio: 0          # 自动划分时unseen比例
  split_seed: 42             # 划分随机种子

  # 零样本推理配置
  zero_shot:
    use_combinations: true   # 是否使用组合特征
    max_combination_size: 2  # 最大组合大小
    threshold: 0.5           # 多标签预测阈值