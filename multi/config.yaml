# ============================================================================
# 组合零样本学习配置文件
# ============================================================================

# CLIP模型配置
model:
  clip_model: "ViT-B/32"       # CLIP模型类型: RN50, RN101, ViT-B/32, ViT-B/16, ViT-L/14, resnet18
  freeze_vision: false         # 设为 false 以启用部分解冻
  vision_layers_unfreeze: 2    # 只解冻视觉编码器最后2层
  freeze_text: true            # 冻结文本编码器

# 训练配置
train:
  batch_size: 32
  epochs: 5
  lr: 0.00001                     # 1e-5
  weight_decay: 0.01
  warmup_epochs: 2
  threshold: 0.5                  # 多标签预测阈值

  # 学习率调度
  scheduler:
    type: "cosine"                # cosine, linear, constant
    min_lr: 0.0000001             # 1e-7

  # 混合精度训练（CLIP内部已使用FP16，建议关闭）
  use_amp: false

  # 梯度裁剪
  grad_clip: 1.0

# 损失函数配置
loss:
  type: "multilabel_infonce"   # label_aware_infonce, infonce, multilabel_infonce, asymmetric, bce
  temperature: 0.07             # 对比损失温度参数
  label_smoothing: 0.0          # 标签平滑
  learnable_temperature: true   # 是否学习温度参数
  handle_zero_sum: "self_only"  # 处理无同类样本的策略: self_only, uniform, skip

# 数据配置
data:
  base_path: "D:/VScode/Jamming_signal_simulation/output/260422"
  jnr_start: 0
  jnr_end: 50
  jnr_step: 5
  num_workers: 4
  pin_memory: true

  # 图像预处理
  image_size: 224                # CLIP输入分辨率

  # 时域数据配置
  time_seq_len: 8000             # 时域信号序列长度
  time_var_name: "all_times"     # 时域数据在HDF5中的变量名

# 模型开关配置
use_time_domain: false          # 是否使用时域信号进行消融实验

# LoRA 微调配置（禁用，改用解冻最后N层策略）
lora:
  enabled: false                # 是否启用 LoRA
  target_modules:               # 目标模块（Attention 层）
    - "attn"
  rank: 8                       # LoRA 秩
  alpha: 16.0                   # LoRA 缩放因子
  dropout: 0.0                  # LoRA Dropout

# ============================================================================
# 日志配置
# ============================================================================
logging:
  type: "console"                # wandb, console, tensorboard
  name: "CLIP_CZSL_Jamming"

  # WandB配置
  wandb:
    project: "CLIP-CZSL-Jamming"
    entity: "cyanke9142-xidian-university"
    tags: ["CLIP", "CZSL", "Multi-label", "Jamming"]
    notes: "CLIP fine-tuning for Compositional Zero-Shot Learning on Radar Jamming Signals"

  # TensorBoard配置
  tensorboard:
    log_dir: "runs/clip_czsl"

# 评估配置
evaluation:
  threshold: 0.5
  save_predictions: true
  visualize_embeddings: true

# 保存配置
checkpoint:
  save_dir: "checkpoints"
  save_best_only: false  # 保存所有epoch的检查点，便于调试
  monitor: "val_f1"             # 监控指标
  mode: "max"                    # max or min

# 干扰类型定义
jamming_classes:
  - name: "DFTJ"
  - name: "ISRJ"
  - name: "AJ"
  - name: "BJ"
  - name: "SJ"
  - name: "NCJ"
  - name: "NPJ"
  - name: "SMSPJ"
  - name: "C&IJ"
  - name: "NFMJ"
  - name: "NPMJ"
  - name: "NAMJ"
  - name: "CSJ"
  - name: "PJ"

# ============================================================================
# 类别名称翻译字典 (缩写 -> 全称)
# 用于生成更具语义的文本描述，提升 CLIP 的理解能力
# ============================================================================
label_translations:
  DFTJ: "Dense False Target Jamming"           # 密集假目标干扰
  ISRJ: "Interrupted Sampling Repeater Jamming" # 间歇采样转发干扰
  AJ: "Aim-point Jamming"                       # 瞄准式干扰
  BJ: "Barrage Jamming"                         # 阻塞式干扰
  SJ: "Sweep Jamming"                           # 扫频干扰
  NCJ: "Noise FM Jamming"                       # 噪声调频干扰
  NPJ: "Noise PM Jamming"                       # 噪声调相干扰
  SMSPJ: "Smoothed Pseudo Wigner-Ville Jamming" # 平滑伪Wigner-Ville干扰
  "C&IJ": "Chopping and Interleaved Jamming"    # 切割交错干扰
  NFMJ: "Noise Frequency Modulation Jamming"    # 噪声调频干扰
  NPMJ: "Noise Phase Modulation Jamming"        # 噪声调相干扰
  NAMJ: "Noise Amplitude Modulation Jamming"    # 噪声调幅干扰
  CSJ: "Comb Spectrum Jamming"                  # 梳状谱干扰
  PJ: "Phase Jamming"                           # 相位干扰

# ============================================================================
# CZSL 配置 - 组合零样本学习
# czsl.seen_combinations: 训练时可见的组合
# czsl.unseen_combinations: 仅测试时评估的零样本组合
# loss.type: "czsl_contrastive": 使用对比损失
# ============================================================================
czsl:
  # Seen/Unseen 组合划分
  # 格式: [类别名] 或 [类别名1, 类别名2] 表示组合

  # 已见组合（用于训练）
  # 默认：所有单干扰类型都是seen
  # 可以添加部分两两组合作为seen
  seen_combinations:
    # 单干扰类型（全部为seen）
    # 欺骗干扰
    - ["DFTJ"]
    - ["ISRJ"]
    - ["SMSPJ"]
    - ["C&IJ"]
    - ["CSJ"]
    # 压制干扰
    - ["AJ"]
    - ["BJ"]
    - ["SJ"]
    - ["NCJ"]
    - ["NPJ"]
    - ["NFMJ"]
    - ["NPMJ"]
    - ["NAMJ"]
    - ["PJ"]

    - ["DFTJ", "AJ"]
    - ["DFTJ", "BJ"]
    - ["DFTJ", "SJ"]
    - ["DFTJ", "NCJ"]
    - ["DFTJ", "NPJ"]
    - ["DFTJ", "NAMJ"]
    - ["DFTJ", "NPMJ"]
    - ["DFTJ", "NFMJ"]
    - ["DFTJ", "PJ"]

    - ["ISRJ", "AJ"]
    - ["ISRJ", "BJ"]
    - ["ISRJ", "SJ"]
    - ["ISRJ", "NCJ"]
    - ["ISRJ", "NPJ"]
    - ["ISRJ", "NAMJ"]
    - ["ISRJ", "NPMJ"]
    - ["ISRJ", "NFMJ"]
    - ["ISRJ", "PJ"]

    - ["SMSPJ", "AJ"]
    - ["SMSPJ", "BJ"]
    - ["SMSPJ", "SJ"]
    - ["SMSPJ", "NCJ"]
    - ["SMSPJ", "NPJ"]
    - ["SMSPJ", "NAMJ"]
    - ["SMSPJ", "NPMJ"]
    - ["SMSPJ", "NFMJ"]
    - ["SMSPJ", "PJ"]

    - ["C&IJ", "AJ"]
    - ["C&IJ", "BJ"]
    - ["C&IJ", "SJ"]
    - ["C&IJ", "NCJ"]
    - ["C&IJ", "NPJ"]
    - ["C&IJ", "NAMJ"]
    - ["C&IJ", "NPMJ"]
    - ["C&IJ", "NFMJ"]
    - ["C&IJ", "PJ"]

    - ["CSJ", "AJ"]
    - ["CSJ", "BJ"]
    - ["CSJ", "SJ"]
    - ["CSJ", "NCJ"]
    - ["CSJ", "NPJ"]
    - ["CSJ", "NAMJ"]
    - ["CSJ", "NPMJ"]
    - ["CSJ", "NFMJ"]
    - ["CSJ", "PJ"]


  # 合作为seen（训练时可见）

  unseen_combinations:
  # 未见组合（用于零样本测试）
  # 这些组合在训练时不出现，但测试时需要识别


  # 数据划分参数
  unseen_ratio: 0          # 自动划分时unseen比例
  split_seed: 42             # 划分随机种子

  # 零样本推理配置
  zero_shot:
    use_combinations: true   # 是否使用组合特征
    max_combination_size: 2  # 最大组合大小
    threshold: 0.14      # 多标签预测阈值